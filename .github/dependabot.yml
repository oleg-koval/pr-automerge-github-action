# All dependency updates (major, minor, patch) across every ecosystem below
# land in one weekly PR. If a major breaks CI, fix it in that PR or add an
# ignore rule for that dependency's major version.
version: 2
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
updates:
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # This repo pins its own action to a reviewed commit, not a release tag.
      # Dependabot would move it back to the latest tag, which can lack the
      # gates the pinned commit has. Bump it by hand after each release.
      - dependency-name: oleg-koval/pr-automerge-github-action
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
