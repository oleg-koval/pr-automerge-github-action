name: PR bot automerge
description: Automerge pull requests from configured maintenance bots and escalate failures to maintainers.
inputs:
  github-token:
    description: GitHub token used to read PR state, comment, and merge.
    required: false
    default: ${{ github.token }}
  bot-logins:
    description: Comma-separated bot logins allowed to automerge.
    required: false
  maintainer-handles:
    description: Comma-separated GitHub handles to mention when manual action is needed.
    required: true
  merge-method:
    description: Merge method. One of merge, squash, rebase.
    required: false
  config-path:
    description: Repository config path.
    required: false
  pr-number:
    description: Pull request number for a per-PR matrix run or a scheduled/manual retry. For webhook events, it must be associated with that event.
    required: false
  wait-timeout:
    description: Maximum time to wait for pending checks and open review threads before deciding. Use Go duration syntax, for example 30m or 0s.
    required: false
  wait-interval:
    description: Initial poll interval while waiting for checks or open review threads; review-thread polling is clamped to one second and backs off up to five minutes. Use Go duration syntax, for example 30s.
    required: false
  ignored-check-names:
    description: Comma-separated exact check run names ignored while deciding merge readiness. Defaults to automerge. Matrix-expanded names must be listed exactly.
    required: false
  dry-run:
    description: Log intended actions without commenting or merging.
    required: false
runs:
  using: docker
  image: Dockerfile
branding:
  icon: arrow-up-left
  color: red
