name: PR bot automerge
description: Automerge pull requests from configured maintenance bots and escalate failures to maintainers.
inputs:
  github-token:
    description: GitHub token used to read PR state, comment, and merge.
    required: false
    default: ${{ github.token }}
  bot-logins:
    description: Comma-separated author logins allowed to automerge. Defaults to dependabot[bot],snyk-bot,renovate[bot],oleg-koval,oleg-koval-fleet[bot]; replaces the default allowlist when set.
    required: false
  maintainer-handles:
    description: Comma-separated GitHub handles to mention when manual action is needed.
    required: true
  merge-method:
    description: Merge method. One of merge, squash, rebase.
    required: false
  config-path:
    description: Repository config path.
    required: false
  pr-number:
    description: Pull request number for a per-PR matrix run or a scheduled/manual retry. For webhook events, it must be associated with that event.
    required: false
  wait-timeout:
    description: Maximum time to wait for pending checks and open review threads before deciding. Use Go duration syntax, for example 30m or 0s.
    required: false
  wait-interval:
    description: Initial poll interval while waiting for checks or open review threads; review-thread polling is clamped to one second and backs off up to five minutes. Use Go duration syntax, for example 30s.
    required: false
  ignored-check-names:
    description: Comma-separated exact check run names eligible for ignoring only when the workflow-run path, repository, head SHA and check suite are verified. Defaults to automerge.
    required: false
  automerge-workflow-path:
    description: Expected repository-relative `.github/workflows/*.yml` path for this automerge workflow. Required to ignore its own check runs; a matching pending check without this path fails immediately with a configuration error.
    required: false
  dry-run:
    description: Log intended actions without commenting or merging.
    required: false
  no-pr-comments:
    description: Suppress all PR comments and merge only while the PR has no issue comments, review comments, or non-empty review bodies.
    required: false
  suppress-comments:
    description: Suppress action-generated PR comments without requiring an empty PR discussion. Does not change merge eligibility.
    required: false
  required-reviewer-login:
    description: Require the latest review from this exact GitHub Bot login to be APPROVED or COMMENTED on the current head. Open review threads still block merging.
    required: false
  required-reviewer-logins:
    description: Comma-separated exact GitHub Bot logins; every listed reviewer must have a latest APPROVED or COMMENTED review on the current head. Open review threads still block merging.
    required: false
  expected-head-sha:
    description: Optional 40-character head SHA guard. The action skips if the PR head differs before evaluation or immediately before merge.
    required: false
runs:
  using: docker
  image: Dockerfile
branding:
  icon: arrow-up-left
  color: red
