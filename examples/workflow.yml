name: Bot automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  check_suite:
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to re-evaluate (blank retries all open PRs)
        required: false
        type: string

permissions: {}

jobs:
  discover:
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      pr-numbers: ${{ steps.list.outputs.pr-numbers }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PR_NUMBER: ${{ inputs.pr-number || '' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule)
              prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
              ;;
            workflow_dispatch)
              if [[ -n "$REQUESTED_PR_NUMBER" ]]; then
                if [[ ! "$REQUESTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                  echo "Invalid pull request number: $REQUESTED_PR_NUMBER" >&2
                  exit 1
                fi
                prs="[$REQUESTED_PR_NUMBER]"
              else
                prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
              fi
              ;;
            check_suite)
              prs="$(jq -c '[.check_suite.pull_requests[]?.number | select(type == "number")] | unique' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              prs="$(jq -c '[.pull_request.number | select(type == "number")]' "$GITHUB_EVENT_PATH")"
              ;;
          esac
          count="$(jq 'length' <<<"$prs")"
          if (( count > 256 )); then
            echo "Found $count pull requests, exceeding GitHub Actions' 256-job matrix limit; refusing to silently skip retries." >&2
            exit 1
          fi
          printf 'pr-numbers=%s\n' "$prs" >> "$GITHUB_OUTPUT"
        shell: bash

  automerge:
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.pr-numbers != '[]'
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      issues: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ fromJSON(needs.discover.outputs.pr-numbers) }}
    concurrency:
      group: automerge-${{ matrix.pr-number }}
      cancel-in-progress: false
    steps:
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          maintainer-handles: oleg-koval,octocat
          pr-number: ${{ matrix.pr-number }}
